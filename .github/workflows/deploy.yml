name: Deploy

on:
  workflow_run:
    workflows: ["Backend SonarQube"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

 
      - name: Build Backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew build


      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Deploy Docker Compose
        run: |
          cd $GITHUB_WORKSPACE
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans