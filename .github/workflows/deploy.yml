name: Full CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:

  backend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Optimize Gradle RAM usage
        run: |
          echo "org.gradle.jvmargs=-Xmx512m -XX:+UseParallelGC" >> backend/gradle.properties
          echo "org.gradle.parallel=true" >> backend/gradle.properties

      - name: Build Backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/build/libs/*.jar


  frontend:
    runs-on: self-hosted
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Remove corrupted cache
        run: rm -rf frontend/node_modules

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: .next
          working-directory: frontend


  deploy:
    runs-on: self-hosted
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: .
      
      - name: Move build artifacts to project folders
        run: |
          mv backend-build/*.jar backend/app.jar
          rm -rf frontend/.next
          mv frontend-build/.next frontend/.next

      - name: Create .env file
        run: |
          cat <<EOF > .env
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          PLUGGY_ID=${{ secrets.PLUGGY_ID }}
          PLUGGY_SECRET=${{ secrets.PLUGGY_SECRET }}
          OTEL_SERVICE_NAME=${{ secrets.OTEL_SERVICE_NAME }}
          OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          EOF

      - name: Prune old docker images
        run: docker image prune -f

      - name: Deploy with Docker Compose
        run: |
          docker compose -f docker-compose.yml down
          docker compose -f docker-compose.yml up -d --remove-orphans
