name: Full CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:

  backend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Optimize Gradle RAM usage
        run: |
          echo "org.gradle.jvmargs=-Xmx512m -XX:+UseParallelGC" >> backend/gradle.properties
          echo "org.gradle.parallel=true" >> backend/gradle.properties

      - name: Build Backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/build/libs/*.jar
          retention-days: 1

  frontend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Clean previous build
        run: |
          rm -rf frontend/.next
          rm -rf frontend/node_modules
          echo "Cleaned previous build artifacts"

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        working-directory: frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          echo "Starting Next.js build in $(pwd)..."
          pnpm build
          echo "Build completed. Verifying .next exists..."
          if [ ! -d ".next" ]; then
            echo "ERROR: .next was not created in $(pwd)"
            ls -la
            exit 1
          fi
          echo ".next directory created successfully"
          ls -la .next | head -10

      - name: Verify .next from root directory
        run: |
          echo "Verifying from root directory: $(pwd)"
          if [ ! -d "frontend/.next" ]; then
            echo "ERROR: frontend/.next does not exist!"
            echo "Current directory contents:"
            ls -la
            echo "Frontend directory contents:"
            ls -la frontend/ || echo "frontend directory not found"
            echo "Searching for .next:"
            find . -name ".next" -type d 2>/dev/null
            exit 1
          fi
          echo "✓ frontend/.next exists"
          echo "Size: $(du -sh frontend/.next | cut -f1)"
          echo "Contents preview:"
          ls -la frontend/.next/ | head -10

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/.next
            frontend/node_modules
            frontend/package.json
            frontend/public
          retention-days: 1
          if-no-files-found: error

  deploy:
    runs-on: self-hosted
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend-artifact

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-artifact

      - name: Debug artifact structure
        run: |
          echo "=== Backend artifact ==="
          find backend-artifact -name "*.jar" -type f
          echo ""
          echo "=== Frontend artifact structure ==="
          ls -la frontend-artifact/
          echo ""
          echo "Searching for .next:"
          find frontend-artifact -name ".next" -type d 2>/dev/null || echo "No .next found"

      - name: Move backend JAR
        run: |
          mkdir -p backend
          JAR_FILE=$(find backend-artifact -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Error: No JAR file found"
            find backend-artifact -type f
            exit 1
          fi
          cp "$JAR_FILE" backend/app.jar
          echo "Copied $(basename $JAR_FILE) to backend/app.jar"

      - name: Move frontend build
        run: |
          mkdir -p frontend
          rm -rf frontend/.next
          
          # Try nested structure first (frontend-artifact/frontend/.next)
          if [ -d "frontend-artifact/frontend/.next" ]; then
            echo "Found nested structure"
            cp -r frontend-artifact/frontend/.next frontend/.next
            [ -d "frontend-artifact/frontend/node_modules" ] && cp -r frontend-artifact/frontend/node_modules frontend/node_modules || true
            [ -f "frontend-artifact/frontend/package.json" ] && cp frontend-artifact/frontend/package.json frontend/package.json || true
            [ -d "frontend-artifact/frontend/public" ] && cp -r frontend-artifact/frontend/public frontend/public || true
          # Try flat structure (frontend-artifact/.next)
          elif [ -d "frontend-artifact/.next" ]; then
            echo "Found flat structure"
            cp -r frontend-artifact/.next frontend/.next
            [ -d "frontend-artifact/node_modules" ] && cp -r frontend-artifact/node_modules frontend/node_modules || true
            [ -f "frontend-artifact/package.json" ] && cp frontend-artifact/package.json frontend/package.json || true
            [ -d "frontend-artifact/public" ] && cp -r frontend-artifact/public frontend/public || true
          else
            echo "ERROR: .next not found in artifact"
            echo "Artifact contents:"
            ls -la frontend-artifact/
            find frontend-artifact -type d -maxdepth 2
            exit 1
          fi
          
          echo "Frontend files copied successfully"
          echo "Verifying .next exists:"
          [ -d "frontend/.next" ] && echo "✓ frontend/.next exists" || echo "✗ frontend/.next missing"

      - name: Create .env file
        run: |
          cat <<EOF > .env
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          PLUGGY_ID=${{ secrets.PLUGGY_ID }}
          PLUGGY_SECRET=${{ secrets.PLUGGY_SECRET }}
          OTEL_SERVICE_NAME=${{ secrets.OTEL_SERVICE_NAME }}
          OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_RESOURCE_ATTRIBUTES=${{ secrets.OTEL_RESOURCE_ATTRIBUTES }}
          EOF

      - name: Prune old docker images
        run: docker image prune -f

      - name: Deploy with Docker Compose
        run: |
          docker compose -f docker-compose.yml down
          docker compose -f docker-compose.yml up -d --build --remove-orphans