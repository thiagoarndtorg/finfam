name: Full CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  backend:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Generate Gradle Wrapper
        working-directory: backend
        run: ./gradlew wrapper --gradle-version 8.14

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build & Analyze Backend
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew build sonar --info
          
  frontend:
    runs-on: self-hosted
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build & Sonar Frontend
        working-directory: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          npm install
          npm run build
          npx sonarqube-scanner \
            -Dsonar.projectKey=thiagoarndtorg_finfam_frontend \
            -Dsonar.organization=thiagoarndtorg \
            -Dsonar.sources=.

  deploy:
    runs-on: self-hosted
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Docker Compose
        run: |
          cd $GITHUB_WORKSPACE
          docker compose -f docker-compose.yml up -d --build --remove-orphans