name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: self-hosted
    # Only deploy if CI workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create .env file
        run: |
          cat > .env << EOF
          MAIL_USERNAME=${{ vars.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          PLUGGY_ID=${{ vars.PLUGGY_ID }}
          PLUGGY_SECRET=${{ secrets.PLUGGY_SECRET }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}

          DB_NAME=${{ vars.DB_NAME }}
          DB_USER=${{ vars.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          FRONTEND_URL=${{ vars.FRONTEND_URL }}
          NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          
          # OTEL_SERVICE_NAME=teste
          OTEL_EXPORTER_OTLP_ENDPOINT=${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS="${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}"
          OTEL_EXPORTER_OTLP_PROTOCOL=${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}

          # BACKEND
          OTEL_SERVICE_NAME_BACKEND=${{ vars.OTEL_SERVICE_NAME_BACKEND }}
          OTEL_RESOURCE_ATTRIBUTES_BACKEND=${{ vars.OTEL_RESOURCE_ATTRIBUTES_BACKEND }}

          # FRONTEND
          OTEL_SERVICE_NAME_FRONTEND=${{ vars.OTEL_SERVICE_NAME_FRONTEND }}
          OTEL_RESOURCE_ATTRIBUTES_FRONTEND=${{ vars.OTEL_RESOURCE_ATTRIBUTES_FRONTEND }}
          EOF
        shell: bash

      - name: Stop running containers
        run: |
          docker compose down || true

      - name: Build and start containers with cache
        run: |
          # Build with parallel builds and cache for faster builds
          docker compose build --parallel
          docker compose up -d

      - name: Cleanup unused images
        run: |
          docker image prune -f