name: Full CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:

  backend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Optimize Gradle RAM usage
        run: |
          echo "org.gradle.jvmargs=-Xmx512m -XX:+UseParallelGC" >> backend/gradle.properties
          echo "org.gradle.parallel=true" >> backend/gradle.properties

      - name: Build Backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/build/libs/*.jar
          retention-days: 1

  frontend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Clean previous build
        run: |
          rm -rf frontend/.next
          rm -rf frontend/node_modules
          echo "Cleaned previous build artifacts"

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        working-directory: frontend
        run: |
          echo "Starting Next.js build..."
          pnpm build || {
            echo "Build failed with exit code $?"
            echo "Checking for build errors..."
            exit 1
          }
          echo "Build completed successfully"

      - name: Verify .next directory exists
        run: |
          if [ ! -d "frontend/.next" ]; then
            echo "ERROR: .next directory was not created!"
            echo "Current directory: $(pwd)"
            echo "Frontend directory contents:"
            ls -la frontend/
            echo "Checking for any .next directories:"
            find . -name ".next" -type d 2>/dev/null || echo "No .next found anywhere"
            exit 1
          fi
          echo ".next directory found!"
          echo "Contents of .next:"
          ls -la frontend/.next/ | head -20
          echo "Size of .next:"
          du -sh frontend/.next/

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/.next
            frontend/node_modules
            frontend/package.json
            frontend/public
          retention-days: 1
          if-no-files-found: error

  deploy:
    runs-on: self-hosted
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend-artifact

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-artifact

      - name: Debug artifact structure
        run: |
          echo "=== Backend artifact structure ==="
          find backend-artifact -type f -name "*.jar" || echo "No JAR files found"
          ls -la backend-artifact/ || echo "backend-artifact directory structure:"
          find backend-artifact -type f || echo "No files found"
          echo ""
          echo "=== Frontend artifact structure ==="
          ls -la frontend-artifact/ || echo "frontend-artifact directory structure:"
          find frontend-artifact -type d -maxdepth 3 || echo "Directory structure:"
          find frontend-artifact -name ".next" -type d || echo ".next not found at root"

      - name: Move backend JAR
        run: |
          mkdir -p backend
          # Find the JAR file (excluding -plain.jar)
          JAR_FILE=$(find backend-artifact -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Error: No JAR file found in backend-artifact"
            find backend-artifact -type f
            exit 1
          fi
          cp "$JAR_FILE" backend/app.jar
          echo "Copied $(basename $JAR_FILE) to backend/app.jar"

      - name: Move frontend build
        run: |
          mkdir -p frontend
          # Remove existing .next if it exists
          rm -rf frontend/.next
          
          # Check for nested structure (frontend-artifact/frontend/.next)
          if [ -d "frontend-artifact/frontend/.next" ]; then
            echo "Found nested structure: frontend-artifact/frontend/.next"
            cp -r frontend-artifact/frontend/.next frontend/.next
            echo "Copied .next directory from nested path"
          # Check for flat structure (frontend-artifact/.next)
          elif [ -d "frontend-artifact/.next" ]; then
            echo "Found flat structure: frontend-artifact/.next"
            cp -r frontend-artifact/.next frontend/.next
            echo "Copied .next directory from flat path"
          else
            echo "Error: .next directory not found in frontend-artifact"
            echo "Searching for .next:"
            find frontend-artifact -name ".next" -type d
            echo "Frontend artifact contents:"
            ls -la frontend-artifact/
            exit 1
          fi
          
          # Copy node_modules if it exists (check both nested and flat)
          if [ -d "frontend-artifact/frontend/node_modules" ]; then
            cp -r frontend-artifact/frontend/node_modules frontend/node_modules
            echo "Copied node_modules directory from nested path"
          elif [ -d "frontend-artifact/node_modules" ]; then
            cp -r frontend-artifact/node_modules frontend/node_modules
            echo "Copied node_modules directory from flat path"
          else
            echo "Warning: node_modules not found, will need to install in Docker"
          fi
          
          # Copy package.json if it exists
          if [ -f "frontend-artifact/frontend/package.json" ]; then
            cp frontend-artifact/frontend/package.json frontend/package.json
            echo "Copied package.json from nested path"
          elif [ -f "frontend-artifact/package.json" ]; then
            cp frontend-artifact/package.json frontend/package.json
            echo "Copied package.json from flat path"
          else
            echo "Warning: package.json not found"
          fi
          
          # Copy public directory if it exists
          if [ -d "frontend-artifact/frontend/public" ]; then
            cp -r frontend-artifact/frontend/public frontend/public
            echo "Copied public directory from nested path"
          elif [ -d "frontend-artifact/public" ]; then
            cp -r frontend-artifact/public frontend/public
            echo "Copied public directory from flat path"
          else
            echo "Warning: public directory not found"
          fi

      - name: Create .env file
        run: |
          cat <<EOF > .env
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          PLUGGY_ID=${{ secrets.PLUGGY_ID }}
          PLUGGY_SECRET=${{ secrets.PLUGGY_SECRET }}
          OTEL_SERVICE_NAME=${{ secrets.OTEL_SERVICE_NAME }}
          OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_RESOURCE_ATTRIBUTES=${{ secrets.OTEL_RESOURCE_ATTRIBUTES }}
          EOF

      - name: Prune old docker images
        run: docker image prune -f

      - name: Deploy with Docker Compose
        run: |
          docker compose -f docker-compose.yml down
          docker compose -f docker-compose.yml up -d --build --remove-orphans