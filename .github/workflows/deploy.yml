name: Full CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:

  backend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Optimize Gradle RAM usage
        run: |
          echo "org.gradle.jvmargs=-Xmx512m -XX:+UseParallelGC" >> backend/gradle.properties
          echo "org.gradle.parallel=true" >> backend/gradle.properties

      - name: Build Backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/build/libs/*.jar
          retention-days: 1

  frontend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Remove corrupted cache
        run: rm -rf frontend/node_modules

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/.next
            frontend/node_modules
            frontend/package.json
            frontend/public
          retention-days: 1

  deploy:
    runs-on: self-hosted
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend-artifact

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-artifact

      - name: Move backend JAR
        run: |
          mkdir -p backend
          # Find the JAR file (excluding -plain.jar)
          JAR_FILE=$(find backend-artifact -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Error: No JAR file found in backend-artifact"
            exit 1
          fi
          cp "$JAR_FILE" backend/app.jar
          echo "Copied $(basename $JAR_FILE) to backend/app.jar"

      - name: Move frontend build
        run: |
          mkdir -p frontend
          # Remove existing .next if it exists
          rm -rf frontend/.next
          # Copy .next directory
          if [ -d "frontend-artifact/.next" ]; then
            cp -r frontend-artifact/.next frontend/.next
            echo "Copied .next directory"
          else
            echo "Error: .next directory not found in frontend-artifact"
            exit 1
          fi
          # Copy node_modules if it exists
          if [ -d "frontend-artifact/node_modules" ]; then
            cp -r frontend-artifact/node_modules frontend/node_modules
            echo "Copied node_modules directory"
          fi
          # Copy package.json if it exists
          if [ -f "frontend-artifact/package.json" ]; then
            cp frontend-artifact/package.json frontend/package.json
            echo "Copied package.json"
          fi
          # Copy public directory if it exists
          if [ -d "frontend-artifact/public" ]; then
            cp -r frontend-artifact/public frontend/public
            echo "Copied public directory"
          fi

      - name: Create .env file
        run: |
          cat <<EOF > .env
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          PLUGGY_ID=${{ secrets.PLUGGY_ID }}
          PLUGGY_SECRET=${{ secrets.PLUGGY_SECRET }}
          OTEL_SERVICE_NAME=${{ secrets.OTEL_SERVICE_NAME }}
          OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_RESOURCE_ATTRIBUTES=${{ secrets.OTEL_RESOURCE_ATTRIBUTES }}
          EOF

      - name: Prune old docker images
        run: docker image prune -f

      - name: Deploy with Docker Compose
        run: |
          docker compose -f docker-compose.yml down
          docker compose -f docker-compose.yml up -d --build --remove-orphans