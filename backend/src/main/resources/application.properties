spring.application.name=fin-fam
frontend.url=${FRONTEND_URL}
ml.service.url=${ML_SERVICE_URL:http://localhost:5000}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fin_fam_db}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

pluggy.client.id=${PLUGGY_ID}
pluggy.client.secret=${PLUGGY_SECRET}
pluggy.api.url=https://api.pluggy.ai

spring.flyway.url=${SPRING_FLYWAY_URL:jdbc:mysql://localhost:3306/fin_fam_db}
spring.flyway.user=${SPRING_FLYWAY_USER:${DB_USER}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${DB_PASSWORD}}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

secret.key=${SECRET_KEY}

logging.level.org.flywaydb=DEBUG
logging.level.org.hibernate.SQL=DEBUG

spring.jpa.database=mysql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8081
logging.level.org.springframework.security=DEBUG
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoints.web.base-path=/actuator

# # OpenTelemetry OTLP Export to Grafana Cloud
#management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT}
#management.otlp.metrics.export.headers[Authorization]=${OTEL_EXPORTER_OTLP_HEADERS}
# management.metrics.export.otlp.enabled=true

management.metrics.export.otlp.enabled=true